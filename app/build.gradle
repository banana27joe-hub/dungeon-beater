apply plugin: 'com.android.application'

android {
    namespace 'com.example.dungeonbeater'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.dungeonbeater"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
